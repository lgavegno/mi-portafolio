    <!--
      canonical, hreflang (es/en/pt/x-default), og:url y og:locale se generan
      dinámicamente vía Helmet según la ruta y el locale real: DefaultMetaTags.jsx
      en home (/, /en, /pt), BlogMetaTags.jsx / ProjectDetail.jsx /
      AgenciasPage.jsx / AgenciesPageEN.jsx / AgenciasPagePT.jsx en el resto.
      No van fijos acá porque react-helmet-async solo agrega tags, no elimina
      los que ya estaban en index.html — tenerlos también acá producía
      duplicados (dos canonical, dos og:url, etc.) en cada página no-home.
    -->
