<svg xmlns="http://www.w3.org/2000/svg"
  width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Fondo -->
  <rect width="1200" height="630" fill="#080c14"/>

  <!-- Glow cyan izquierda -->
  <radialGradient id="g1" cx="30%" cy="40%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g1)"/>

  <!-- Glow indigo derecha -->
  <radialGradient id="g2" cx="80%" cy="70%">
    <stop offset="0%" stop-color="#818cf8" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Ícono nodo - centrado verticalmente, lado izquierdo -->
  <g transform="translate(120, 255)">
    <line x1="60" y1="55" x2="20" y2="95"
      stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="55" x2="100" y2="95"
      stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="55" x2="60" y2="15"
      stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="55" r="10" fill="#0ea5e9"/>
    <circle cx="20" cy="95" r="7" fill="none"
      stroke="#22d3ee" stroke-width="2"/>
    <circle cx="100" cy="95" r="7" fill="none"
      stroke="#22d3ee" stroke-width="2"/>
    <circle cx="60" cy="15" r="7" fill="none"
      stroke="#22d3ee" stroke-width="2"/>
  </g>

  <!-- Texto ONGEVAG -->
  <text x="280" y="300"
    font-family="Arial Black, sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="-2"
    fill="#f0f4f8">ONGE</text>
  <text x="680" y="300"
    font-family="Arial Black, sans-serif"
    font-size="96"
    font-weight="900"
    letter-spacing="-2"
    fill="#22d3ee">VAG</text>

  <!-- Subtítulo -->
  <text x="280" y="355"
    font-family="Arial, sans-serif"
    font-size="24"
    fill="#64748b"
    letter-spacing="3">SOFTWARE DEVELOPER · DATA & SYSTEMS</text>

  <!-- URL -->
  <text x="280" y="430"
    font-family="Arial, sans-serif"
    font-size="18"
    fill="#334155">www.ongevag.com</text>

  <!-- Línea decorativa -->
  <line x1="280" y1="390" x2="900" y2="390"
    stroke="#1e293b" stroke-width="1"/>
</svg>